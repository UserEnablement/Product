<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oliver Admin Academy — Requests Completed</title>
<style>
  :root{
    --navy:#1E2761;
    --mint-deep:#028090;
    --mint:#00A896;
    --ice:#CADCFC;
    --amber:#C07000;
    --bg:#F5F7FB;
    --card:#FFFFFF;
    --text:#1B2033;
    --text-muted:#6B7280;
    --border:#E2E6EF;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    padding-bottom:60px;
  }
  header{
    background:#fff;
    color:var(--navy);
    padding:18px 24px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:3px solid var(--mint);
  }
  header img{height:42px;width:auto;}
  header h1{font-size:19px;font-weight:700;margin:0;color:var(--navy);}
  header p{margin:2px 0 0;font-size:13px;color:var(--mint-deep);font-weight:600;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}

  .conn-banner{
    margin-top:16px;
    padding:10px 16px;
    border-radius:var(--radius);
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .conn-connected{background:#E7F7F1;color:#0B5D3B;border:1px solid #BEE7D3;}
  .conn-disconnected{background:#FFF4E5;color:#8A5A00;border:1px solid #F3DBAE;}
  .conn-unsupported{background:#F1F2F6;color:var(--text-muted);border:1px solid var(--border);}
  .btn{
    border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;
    cursor:pointer;transition:opacity .15s;
  }
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid currentColor;color:inherit;}
  .btn-sm{padding:6px 10px;font-size:12px;}

  .counter-row{
    margin-top:24px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .counter{font-size:22px;font-weight:600;color:var(--navy);}
  .counter span{color:var(--mint-deep);}
  .progress-track{
    margin-top:10px;height:10px;border-radius:6px;background:var(--border);overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--mint),var(--mint-deep));
    border-radius:6px;transition:width .3s;
  }

  .tier{margin-top:32px;}
  .tier-head{
    display:flex;align-items:center;gap:14px;margin-bottom:14px;
  }
  .badge-chip{
    width:58px;height:58px;flex:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;background:#EDEFF5;
  }
  .badge-chip img{
    width:100%;height:100%;object-fit:cover;
    filter:grayscale(1) opacity(0.4);
    transition:filter .2s;
  }
  .badge-chip.earned img{filter:none;}
  .badge-chip.earned{box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--mint);}

  .tier-info h2{font-size:16px;font-weight:600;margin:0;color:var(--navy);}
  .tier-info p{font-size:12.5px;color:var(--text-muted);margin:2px 0 0;}
  .tier-fraction{margin-left:auto;font-size:13px;color:var(--text-muted);font-weight:600;}

  .tile-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;
  }
  .tile{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;cursor:pointer;user-select:none;transition:box-shadow .15s,border-color .15s;
  }
  .tile:hover{box-shadow:0 2px 10px rgba(30,39,97,0.08);}
  .tile-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .tile-num{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.03em;}
  .tile-name{font-size:14px;font-weight:600;margin-top:4px;color:var(--text);}
  .status-pill{
    font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;
  }
  .status-not_started{background:#F1F2F6;color:var(--text-muted);}
  .status-in_progress{background:#FFF4E5;color:#8A5A00;}
  .status-complete{background:#E7F7F1;color:#0B5D3B;}
  .tile-date{font-size:11.5px;color:var(--text-muted);margin-top:8px;}

  .cert-section{
    margin-top:40px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:28px;text-align:center;
  }
  .cert-locked{color:var(--text-muted);padding:20px 0;}
  .cert-locked .lock-icon{font-size:28px;display:block;margin-bottom:8px;}
  .cert-unlocked .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--mint-deep);font-weight:700;text-transform:uppercase;}
  .cert-unlocked h2{color:var(--navy);font-size:20px;margin:6px 0 4px;}
  .cert-unlocked .sub{color:var(--text-muted);font-size:13px;}

  .cert-card{
    margin:22px auto 0;max-width:640px;position:relative;
    border:3px solid var(--navy);border-radius:4px;
    padding:8px;background:#fff;
  }
  .cert-inner{
    border:1px solid var(--mint);border-radius:2px;
    padding:38px 34px 30px;position:relative;
  }
  .cert-inner::before,.cert-inner::after,
  .cert-corner-tl,.cert-corner-tr,.cert-corner-bl,.cert-corner-br{
    content:"";position:absolute;width:16px;height:16px;
    border-color:var(--amber);
  }
  .cert-corner-tl{top:6px;left:6px;border-top:2px solid var(--amber);border-left:2px solid var(--amber);}
  .cert-corner-tr{top:6px;right:6px;border-top:2px solid var(--amber);border-right:2px solid var(--amber);}
  .cert-corner-bl{bottom:6px;left:6px;border-bottom:2px solid var(--amber);border-left:2px solid var(--amber);}
  .cert-corner-br{bottom:6px;right:6px;border-bottom:2px solid var(--amber);border-right:2px solid var(--amber);}

  .cert-logo{height:34px;width:auto;margin-bottom:10px;}
  .cert-org{font-size:12px;letter-spacing:.18em;color:var(--mint-deep);font-weight:700;text-transform:uppercase;}
  .cert-title{font-size:26px;font-weight:700;color:var(--navy);margin:10px 0 2px;font-family:Georgia,'Times New Roman',serif;}
  .cert-subtitle{font-size:12.5px;color:var(--text-muted);}
  .cert-presented{font-size:12px;color:var(--text-muted);margin-top:22px;letter-spacing:.05em;text-transform:uppercase;}
  .cert-name{
    font-size:30px;font-weight:700;color:var(--navy);margin:8px 0 2px;
    font-family:Georgia,'Times New Roman',serif;border-bottom:1.5px solid var(--ice);
    display:inline-block;padding:0 6px 8px;min-width:280px;
  }
  .cert-body{font-size:13.5px;color:var(--text);max-width:440px;margin:16px auto 0;line-height:1.6;}
  .cert-body strong{color:var(--navy);}
  .cert-badgerow{display:flex;justify-content:center;gap:12px;margin-top:22px;}
  .cert-badgerow img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--mint);}
  .cert-footer{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-top:26px;padding-top:14px;border-top:1px solid var(--border);
    font-size:11px;color:var(--text-muted);
  }
  .cert-footer .date-block{text-align:left;}
  .cert-footer .id-block{text-align:right;}
  .cert-footer strong{display:block;color:var(--navy);font-size:12.5px;}

  .name-input{
    margin-top:14px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;width:240px;max-width:80%;
  }

  .toolbar{
    margin-top:36px;padding-top:20px;border-top:1px solid var(--border);
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  .toolbar .spacer{flex:1;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
  }
  .toast.show{opacity:1;}

  @media print{
    header,.conn-banner,.counter-row,#progressFillWrap,.progress-track,.tier,.toolbar,#toast,
    .cert-unlocked .eyebrow,.cert-unlocked h2,.cert-unlocked .sub,
    .cert-section button{display:none !important;}
    body{background:#fff;padding-bottom:0;}
    .cert-section{border:none;padding:0;margin-top:0;}
    .cert-card{max-width:100%;margin-top:20px;}
  }
</style>
</head>

const STATUS_CYCLE = ["not_started","in_progress","complete"];
const STATUS_LABEL = {not_started:"Not started", in_progress:"In progress", complete:"Complete"};
const STORAGE_KEY = "oaa_requests_tracker_v1";

/* ---------- State ---------- */
let STATE = {
  learnerName: "",
  modules: {},
  certificateIssuedDate: null
};

function defaultModuleState(){ return {status:"not_started", dateCompleted:null}; }

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      STATE.learnerName = parsed.learnerName || "";
      STATE.certificateIssuedDate = parsed.certificateIssuedDate || null;
      STATE.modules = parsed.modules || {};
      return true;
    }
  }catch(e){}
  return false;
}
MODULES.forEach(m => { if(!STATE.modules[m.n]) STATE.modules[m.n] = defaultModuleState(); });

function saveLocal(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
}
function saveAll(){
  saveLocal();
  if(fileConnected) writeStateToFile();
}

/* ---------- Computed values ---------- */
function casesClosed(){
  return MODULES.filter(m => STATE.modules[m.n].status === "complete").length;
}
function tierModules(tierId){ return MODULES.filter(m => m.tier === tierId); }
function tierComplete(tierId){
  return tierModules(tierId).every(m => STATE.modules[m.n].status === "complete");
}
function certificateEligible(){ return casesClosed() === 17; }

/* ---------- Rendering ---------- */
function render(){
  const closed = casesClosed();
  document.getElementById("casesClosedNum").textContent = closed;
  document.getElementById("progressFill").style.width = Math.round((closed/17)*100) + "%";

  const container = document.getElementById("tiersContainer");
  container.innerHTML = "";
  TIERS.forEach(tier => {
    const mods = tierModules(tier.id);
    const done = mods.filter(m => STATE.modules[m.n].status === "complete").length;
    const earned = tierComplete(tier.id);

    const tierEl = document.createElement("div");
    tierEl.className = "tier";
    tierEl.innerHTML = `
      <div class="tier-head">
        <div class="badge-chip${earned ? " earned" : ""}">
          <img src="data:image/png;base64,${tier.badge}" alt="${tier.name} badge">
        </div>
        <div class="tier-info">
          <h2>${tier.name}</h2>
          <p>${tier.range}</p>
        </div>
        <div class="tier-fraction">${done}/${mods.length}</div>
      </div>
      <div class="tile-grid">
        ${mods.map(m => tileHtml(m)).join("")}
      </div>
    `;
    container.appendChild(tierEl);
  });

  container.querySelectorAll(".tile").forEach(el => {
    el.addEventListener("click", () => cycleStatus(Number(el.dataset.mod)));
  });

  renderCertificate();
  document.getElementById("learnerNameInput").value = STATE.learnerName || "";
}

function tileHtml(m){
  const s = STATE.modules[m.n];
  const dateLine = s.status === "complete" && s.dateCompleted
    ? `<div class="tile-date">Completed ${s.dateCompleted}</div>` : "";
  return `
    <div class="tile" data-mod="${m.n}">
      <div class="tile-top">
        <span class="tile-num">MODULE ${String(m.n).padStart(2,"0")}</span>
        <span class="status-pill status-${s.status}">${STATUS_LABEL[s.status]}</span>
      </div>
      <div class="tile-name">${m.name}</div>
      ${dateLine}
    </div>
  `;
}

function cycleStatus(n){
  const s = STATE.modules[n];
  const idx = STATUS_CYCLE.indexOf(s.status);
  const next = STATUS_CYCLE[(idx+1) % STATUS_CYCLE.length];
  s.status = next;
  s.dateCompleted = next === "complete" ? todayStr() : null;

  if(certificateEligible() && !STATE.certificateIssuedDate){
    STATE.certificateIssuedDate = todayStr();
  }
  if(!certificateEligible()){
    STATE.certificateIssuedDate = null;
  }

  saveAll();
  render();
}

function certId(){
  const base = (STATE.learnerName || "OAA") + "-" + (STATE.certificateIssuedDate || "");
  let hash = 0;
  for(let i=0;i<base.length;i++){ hash = ((hash<<5)-hash + base.charCodeAt(i)) | 0; }
  return "OAA-" + Math.abs(hash).toString(36).toUpperCase().slice(0,7);
}

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString(undefined, {year:"numeric", month:"long", day:"numeric"});
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

/* ---------- Learner name + manual export/import ---------- */
document.getElementById("learnerNameInput").addEventListener("input", (e) => {
  STATE.learnerName = e.target.value;
  saveAll();
  renderCertificate();
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "oliver-academy-progress.json";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("importInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    STATE.learnerName = parsed.learnerName || "";
    STATE.certificateIssuedDate = parsed.certificateIssuedDate || null;
    STATE.modules = parsed.modules || {};
    MODULES.forEach(m => { if(!STATE.modules[m.n]) STATE.modules[m.n] = defaultModuleState(); });
    saveAll();
    render();
    showToast("Progress imported.");
  }catch(err){
    showToast("Could not read that file — is it a tracker backup .json?");
  }
  e.target.value = "";
});

/* ---------- Optional personal backup file (File System Access API) ----------
   Adapted from Training_Tracker_260630.html's single-file connect + IndexedDB
   handle-persistence pattern. One JSON file, this learner's own — no folder
   scanning or multi-user aggregation. */
const FSA_SUPPORTED = "showSaveFilePicker" in window;
let fileHandle = null;
let fileConnected = false;
let connectedFileName = "";

function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("oaa_tracker_fsa", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetHandle(){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction("handles", "readonly");
      const req = tx.objectStore("handles").get("backupFile");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbSetHandle(handle){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").put(handle, "backupFile");
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ return false; }
}
async function idbClearHandle(){
  try{
    const db = await idbOpen();
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").delete("backupFile");
  }catch(e){}
}

async function connectBackupFile(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: "oliver-academy-progress.json",
      types: [{description:"JSON backup", accept:{"application/json":[".json"]}}]
    });
    const perm = await handle.requestPermission({mode:"readwrite"});
    if(perm !== "granted"){ showToast("Permission was not granted."); return; }
    fileHandle = handle;
    fileConnected = true;
    connectedFileName = handle.name;
    await idbSetHandle(handle);
    await writeStateToFile();
    renderConnectionBanner();
    showToast("Connected to " + connectedFileName + ".");
  }catch(e){
    if(e.name !== "AbortError") showToast("Could not connect to a backup file.");
  }
}

async function reconfirmPermission(){
  if(!fileHandle){ return connectBackupFile(); }
  try{
    const perm = await fileHandle.requestPermission({mode:"readwrite"});
    if(perm === "granted"){
      fileConnected = true;
      connectedFileName = fileHandle.name;
      await writeStateToFile();
      renderConnectionBanner();
      showToast("Reconnected to " + connectedFileName + ".");
    } else {
      showToast("Permission was not granted.");
    }
  }catch(e){
    showToast("Could not reconnect — try Connect again.");
  }
}

async function disconnectBackupFile(){
  fileHandle = null;
  fileConnected = false;
  connectedFileName = "";
  await idbClearHandle();
  renderConnectionBanner();
  showToast("Disconnected. Saving to this browser only.");
}

async function tryReconnectSilently(){
  const handle = await idbGetHandle();
  if(!handle){ renderConnectionBanner(); return; }
  fileHandle = handle;
  try{
    const perm = await handle.queryPermission({mode:"readwrite"});
    if(perm === "granted"){
      fileConnected = true;
      connectedFileName = handle.name;
      // If this browser has no local progress yet, recover it from the backup file.
      const hadLocal = localStorage.getItem(STORAGE_KEY);
      if(!hadLocal) await readStateFromFile();
      renderConnectionBanner();
      return;
    }
  }catch(e){}
  renderConnectionBanner();
}

async function readStateFromFile(){
  try{
    const file = await fileHandle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    STATE.learnerName = parsed.learnerName || "";
    STATE.certificateIssuedDate = parsed.certificateIssuedDate || null;
    STATE.modules = parsed.modules || {};
    MODULES.forEach(m => { if(!STATE.modules[m.n]) STATE.modules[m.n] = defaultModuleState(); });
    saveLocal();
    render();
  }catch(e){
    showToast("Could not read the linked backup file.");
  }
}

async function writeStateToFile(){
  if(!fileConnected || !fileHandle) return;
  try{
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(STATE, null, 2));
    await writable.close();
  }catch(e){
    showToast("Could not save to the backup file — your progress is still saved in this browser.");
  }
}

function renderConnectionBanner(){
  const el = document.getElementById("connectionBanner");
  if(!FSA_SUPPORTED){
    el.innerHTML = `<div class="conn-banner conn-unsupported">This browser doesn't support linking a personal backup file — progress still saves automatically in this browser. Use <strong>Export backup</strong> below to keep a copy, and <strong>Import backup</strong> to restore it on another device.</div>`;
    return;
  }
  if(fileConnected){
    el.innerHTML = `<div class="conn-banner conn-connected">Backed up to <strong>${escapeHtml(connectedFileName)}</strong> — updates automatically as you go.
      <button class="btn btn-ghost btn-sm" id="bannerDisconnect">Disconnect</button></div>`;
    document.getElementById("bannerDisconnect").addEventListener("click", disconnectBackupFile);
  } else if(fileHandle){
    el.innerHTML = `<div class="conn-banner conn-disconnected">Personal backup file needs to be reconfirmed for this session.
      <button class="btn btn-primary btn-sm" id="bannerReconnect">Reconnect</button></div>`;
    document.getElementById("bannerReconnect").addEventListener("click", reconfirmPermission);
  } else {
    el.innerHTML = `<div class="conn-banner conn-disconnected">Not linked to a personal backup file — currently saving to this browser only.
      <button class="btn btn-primary btn-sm" id="bannerConnect">Link a backup file</button></div>`;
    document.getElementById("bannerConnect").addEventListener("click", connectBackupFile);
  }
}

/* ---------- Init ---------- */
loadLocal();
render();
renderConnectionBanner();
tryReconnectSilently();
