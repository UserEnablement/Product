<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Oliver Admin — Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#21C9BE;--teal-mid:#017871;--teal-dark:#014040;--teal-bg:#EBF9F8;
  --text:#1A1A2E;--muted:#6B7280;--border:#E5E7EB;--bg:#F3F4F6;
  --r-sm:8px;--r-md:14px;--r-lg:24px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --shadow-hover:0 4px 24px rgba(0,0,0,.13),0 1px 4px rgba(0,0,0,.08);
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--teal-dark) 0%,#016B65 60%,#017871 100%);
  padding:48px 20px 56px;text-align:center;position:relative;overflow:hidden
}
header::after{
  content:'';position:absolute;bottom:-2px;left:0;right:0;height:40px;
  background:var(--bg);clip-path:ellipse(55% 100% at 50% 100%)
}
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
.logo-img{width:56px;height:56px;border-radius:12px;background:rgba(255,255,255,.15);padding:6px}
.brand{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:#fff}
.brand span{color:var(--teal);}
.tagline{font-size:15px;color:rgba(255,255,255,.7);max-width:480px;margin:0 auto;line-height:1.6}

/* MAIN */
main{max-width:860px;margin:0 auto;padding:40px 20px 80px}

/* SECTION LABEL */
.section-label{
  font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:16px;padding-left:2px
}

/* CARD GRID */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:48px}

/* TRAINING CARD */
.card{
  background:#fff;border-radius:var(--r-lg);padding:24px;
  box-shadow:var(--shadow);border:2px solid transparent;
  text-decoration:none;color:var(--text);
  transition:all .22s ease;display:flex;flex-direction:column;gap:10px;
  cursor:pointer
}
.card:hover{
  border-color:var(--teal);box-shadow:var(--shadow-hover);
  transform:translateY(-2px)
}
.card-icon{font-size:36px;line-height:1}
.card-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  padding:3px 10px;border-radius:20px;width:fit-content
}
.card-badge.chapter{background:var(--teal-bg);color:var(--teal-dark)}
.card-badge.role{background:#F3F0FF;color:#5B21B6}
.card-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:var(--teal-dark)}
.card-desc{font-size:13px;color:var(--muted);line-height:1.6;flex:1}
.card-meta{
  display:flex;gap:10px;flex-wrap:wrap;padding-top:10px;
  border-top:1px solid var(--border)
}
.meta-tag{
  font-size:11px;color:var(--muted);background:var(--bg);
  border-radius:20px;padding:2px 10px;border:1px solid var(--border)
}
.card-cta{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--teal-mid);margin-top:4px
}
.card-cta::after{content:'→';transition:transform .2s}
.card:hover .card-cta::after{transform:translateX(4px)}

/* COMING SOON CARD */
.card.coming-soon{opacity:.55;cursor:default;pointer-events:none}
.card.coming-soon:hover{transform:none;border-color:transparent;box-shadow:var(--shadow)}
.coming-label{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);background:var(--bg);border:1px solid var(--border);
  border-radius:20px;padding:2px 10px;width:fit-content
}

/* ADD CARD (for future use in template) */
.card.add-card{
  border:2px dashed var(--border);background:transparent;
  box-shadow:none;align-items:center;justify-content:center;
  text-align:center;min-height:180px;gap:8px
}
.card.add-card:hover{border-color:var(--teal);background:var(--teal-bg)}
.add-icon{font-size:28px;color:var(--muted)}
.add-text{font-size:13px;font-weight:600;color:var(--muted)}

/* FOOTER */
footer{
  text-align:center;padding:24px 20px;
  font-size:12px;color:var(--muted);border-top:1px solid var(--border)
}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:28px}
.search-input{width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:1.5px solid var(--border);
  font-family:'Outfit',sans-serif;font-size:14px;background:#fff;box-shadow:var(--shadow);outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--teal)}
.search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

/* CHAPTER GROUP */
.chapter{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border:2px solid transparent;transition:border-color .2s}
.chapter.open{border-color:var(--teal)}
.chapter-head{display:flex;align-items:center;gap:14px;padding:18px 22px;cursor:pointer;user-select:none}
.chapter-icon{font-size:28px;line-height:1;flex-shrink:0}
.chapter-info{flex:1;min-width:0}
.chapter-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chapter-title{font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--teal-dark)}
.chapter-desc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.chapter-progress{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chapter-progress-bar{width:64px;height:6px;border-radius:999px;background:var(--bg);overflow:hidden}
.chapter-progress-fill{height:100%;background:var(--teal);border-radius:999px;transition:width .3s}
.chapter-progress-label{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.chapter-chevron{font-size:13px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.chapter.open .chapter-chevron{transform:rotate(180deg)}
.chapter-parts{max-height:0;overflow:hidden;transition:max-height .25s ease}
.chapter.open .chapter-parts{max-height:2000px}
.chapter-parts-inner{padding:0 22px 20px;display:flex;flex-direction:column;gap:8px}

/* PART ROW */
.part-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;
  border:1.5px solid var(--border);text-decoration:none;color:var(--text);transition:all .18s}
.part-row:hover{border-color:var(--teal);background:var(--teal-bg)}
.part-n{width:26px;height:26px;border-radius:50%;background:var(--teal-bg);color:var(--teal-dark);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.part-body{flex:1;min-width:0}
.part-title{font-size:14px;font-weight:600;color:var(--text)}
.part-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.status-badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.status-badge.not-started{background:var(--bg);color:var(--muted)}
.status-badge.started{background:#FEF3CD;color:#7A4400}
.status-badge.complete{background:#DCFCE7;color:#166534}

/* SINGLE-PART CHAPTER (no accordion needed) */
.chapter.single .chapter-head{cursor:default}
.chapter.single .chapter-chevron{display:none}

.no-results{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}

  color:var(--teal-dark);background:#fff;border:1.5px solid var(--border);border-radius:10px;
  padding:7px 14px;cursor:pointer;transition:all .18s;font-family:'Outfit',sans-serif}

<main>

  <div class="progress-controls">

      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>

<script>
var CHAPTERS = [{"id": "ch01", "num": "01", "title": "Getting Started", "icon": "\ud83d\ude80", "desc": "Log in, navigate the dashboard, access help, submit feedback, manage your password, configure account settings, and log out.", "parts": [{"title": "Getting Started", "id": "chapter-01-getting-started.html", "file": "https://userenablement.github.io/Product/Admin01GettingStarted/", "tasks": 10, "mins": 20, "note": "Guided + Test mode", "taskNames": []}]}, {"id": "ch02", "num": "02", "title": "Members", "icon": "\ud83d\udc65", "desc": "Search across the client account, run the enrolment wizard, manage member records, and configure health and benefit details.", "parts": [{"title": "Search & Members List", "id": "admin-02-members-part1-search-and-list.html", "file": "https://userenablement.github.io/Product/Admin01MembersP1Search%26List", "tasks": 9, "mins": 15, "note": "Guided + Test mode", "taskNames": ["Navigating the Search Module", "The Members Module", "Member Details vs. Health and Benefit Details", "Searching by Column", "Active Filter Tags", "Removing a Filter", "Searching by a Specific Column Value", "Combining Multiple Filters", "Sorting Columns"]}, {"title": "Member Enrolment Wizard", "id": "admin-02-members-part2-enrolment-wizard.html", "file": "admin-02-members-part2-enrolment-wizard.html", "tasks": 10, "mins": 30, "note": "Placeholder screenshots", "taskNames": ["Starting Member Enrolment", "Personal Details", "Banking Details", "Member ID Mapping Details", "Employment Details", "Class & Benefit Plans", "Benefits Selection", "Beneficiaries", "Family Details", "Review and Confirm"]}, {"title": "Member Record Management", "id": "admin-02-members-part3-record-management.html", "file": "admin-02-members-part3-record-management.html", "tasks": 8, "mins": 30, "note": "Placeholder screenshots", "taskNames": ["The Member Details Page", "Employment History", "Uploading a Member Document", "Adding Payment Information", "Terminating a Member", "Reinstating a Member", "Updating Employment Details on Reinstatement", "Managing ID Mapping on a Member Record"]}, {"title": "Health & Benefit Details", "id": "admin-02-members-part4-health-benefit-details.html", "file": "admin-02-members-part4-health-benefit-details.html", "tasks": 11, "mins": 40, "note": "Placeholder screenshots", "taskNames": ["Orienting to Health and Benefit Details", "Enrollment Form Received and Late Applicant", "Assigning or Changing a Benefit Plan", "Changing Dependent Status", "Adding a Dependent (Post-Enrolment)", "Core Benefit Override", "Adding Disability Status", "Adding Smoker Status", "Voluntary Benefits", "Coordination of Benefits", "Benefit Adjustments"]}]}];
var ROLE_MODULES = [{"id": "su", "num": null, "title": "SU Administration", "icon": "\ud83d\udee1\ufe0f", "badge_label": "Super Users only", "desc": "Manage user accounts, configure permission groups, and control module access across the plan.", "parts": [{"title": "SU Administration", "id": "su-admin.html", "file": "su-admin.html", "tasks": 5, "mins": 10, "note": "Guided + Test mode", "taskNames": []}]}];

function getStatus(id){
  try{
    var v = localStorage.getItem('oliverAdminProgress:' + id);
    return v || 'not-started';
  }catch(e){ return 'not-started'; }
}
function statusLabel(s){
  return s === 'complete' ? 'Complete' : s === 'started' ? 'In progress' : 'Not started';
}

function exportProgress(){
  try{
    var data = {};
    for (var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (k && k.indexOf('oliverAdminProgress:') === 0) data[k] = localStorage.getItem(k);
    }
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'oliver-admin-progress.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showProgressNote('Progress file saved.', 'success');
  }catch(e){ showProgressNote('Could not save progress.', 'error'); }
}

function importProgress(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      var count = 0;
      Object.keys(data).forEach(function(k){
        if (k.indexOf('oliverAdminProgress:') === 0){
          localStorage.setItem(k, data[k]);
          count++;
        }
      });
      renderGroup(CHAPTERS, 'chapters-mount', false);
      renderGroup(ROLE_MODULES, 'roles-mount', true);
      showProgressNote('Progress restored (' + count + ' module' + (count===1?'':'s') + ').', 'success');
    }catch(err){
      showProgressNote('That file could not be read. Make sure it is a progress file saved from this hub.', 'error');
    }
  };
  reader.readAsText(file);
  document.getElementById('import-file-input').value = '';
}

function showProgressNote(msg, type){
  var el = document.getElementById('progress-note');
  if (!el) return;
  el.textContent = msg;
  el.className = 'progress-note ' + (type||'');
  setTimeout(function(){ el.textContent=''; el.className='progress-note'; }, 5000);
}

function renderGroup(items, mountId, isRole){
  var mount = document.getElementById(mountId);
  var html = '';
  items.forEach(function(ch){
    var statuses = ch.parts.map(function(p){ return getStatus(p.id); });
    var doneCount = statuses.filter(function(s){ return s === 'complete'; }).length;
    var pct = ch.parts.length ? Math.round(doneCount / ch.parts.length * 100) : 0;
    var single = ch.parts.length === 1;
    var badgeLabel = isRole ? ch.badge_label : ('Chapter ' + ch.num);

    var partsHtml = ch.parts.map(function(p, i){
      var st = getStatus(p.id);
      return '<a class="part-row" href="' + p.file + '" data-tasks=\'' + JSON.stringify(p.taskNames||[]).replace(/'/g,"&#39;") + '\' data-title="' + p.title.toLowerCase() + '">' +
        (single ? '' : '<span class="part-n">' + (i+1) + '</span>') +
        '<span class="part-body">' +
          '<span class="part-title">' + p.title + '</span>' +
          '<span class="part-meta">' + p.tasks + ' tasks &middot; ~' + p.mins + ' min &middot; ' + p.note + '</span>' +
          '<span class="match-hint" style="display:none"></span>' +
        '</span>' +
        '<span class="status-badge ' + st + '">' + statusLabel(st) + '</span>' +
      '</a>';
    }).join('');

    html +=
      '<div class="chapter ' + (single ? 'single' : '') + '" data-search="' + (ch.title + ' ' + ch.desc).toLowerCase() + '" id="' + ch.id + '">' +
        '<div class="chapter-head" onclick="' + (single ? '' : "toggleChapter('" + ch.id + "')") + '">' +
          '<div class="chapter-icon">' + ch.icon + '</div>' +
          '<div class="chapter-info">' +
            '<div class="chapter-title-row">' +
              '<span class="card-badge ' + (isRole?'role':'chapter') + '">' + badgeLabel + '</span>' +
              '<span class="chapter-title">' + ch.title + '</span>' +
            '</div>' +
            '<div class="chapter-desc">' + ch.desc + '</div>' +
          '</div>' +
          (single ? '' :
          '<div class="chapter-progress">' +
            '<div class="chapter-progress-bar"><div class="chapter-progress-fill" style="width:' + pct + '%"></div></div>' +
            '<span class="chapter-progress-label">' + doneCount + '/' + ch.parts.length + '</span>' +
          '</div>') +
          (single ? '' : '<div class="chapter-chevron">&#9660;</div>') +
        '</div>' +
        (single
          ? '<div class="chapter-parts-inner" style="padding:0 22px 20px">' + partsHtml + '</div>'
          : '<div class="chapter-parts" id="parts-' + ch.id + '"><div class="chapter-parts-inner">' + partsHtml + '</div></div>') +
      '</div>';
  });
  mount.innerHTML = html;
}

function toggleChapter(id){
  var el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function filterAll(q){
  q = q.trim().toLowerCase();
  var chapters = document.querySelectorAll('.chapter');
  var anyVisible = false;
  chapters.forEach(function(ch){
    var chapterHay = ch.getAttribute('data-search') || '';
    var chapterLevelMatch = !q || chapterHay.indexOf(q) !== -1;
    var rows = ch.querySelectorAll('.part-row');
    var anyRowVisible = false;

    rows.forEach(function(row){
      var hint = row.querySelector('.match-hint');
      var title = row.getAttribute('data-title') || '';
      var tasks = [];
      try { tasks = JSON.parse(row.getAttribute('data-tasks') || '[]'); } catch(e){}

      var titleMatch = !q || title.indexOf(q) !== -1;
      var taskHit = null;
      if (q) {
        for (var i = 0; i < tasks.length; i++) {
          if (tasks[i].toLowerCase().indexOf(q) !== -1) { taskHit = tasks[i]; break; }
        }
      }
      var rowMatch = !q || chapterLevelMatch || titleMatch || taskHit;
      row.style.display = rowMatch ? '' : 'none';
      if (rowMatch) anyRowVisible = true;

      if (hint) {
        if (taskHit && !titleMatch) {
          hint.textContent = 'Matches: "' + taskHit + '"';
          hint.style.display = 'block';
        } else {
          hint.style.display = 'none';
        }
      }
    });

    var chapterMatch = chapterLevelMatch || anyRowVisible;
    ch.style.display = chapterMatch ? '' : 'none';
    if (chapterMatch) anyVisible = true;
    if (chapterMatch && q && !ch.classList.contains('single')) ch.classList.add('open');
    if (!q) ch.classList.remove('open');
  });
  document.getElementById('no-results').style.display = anyVisible ? 'none' : 'block';
}

renderGroup(CHAPTERS, 'chapters-mount', false);
renderGroup(ROLE_MODULES, 'roles-mount', true);
document.getElementById('search-input').addEventListener('input', function(e){ filterAll(e.target.value); });
</script>
